<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson AI - Terminal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a0011">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #050505; color: #d1d5db; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(12px); padding: 16px; text-align: center; border-bottom: 2px solid #5a0011; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 25px rgba(255, 0, 51, 0.15); z-index: 10; }
        .status-dot { width: 10px; height: 10px; background-color: #ff0033; border-radius: 50%; box-shadow: 0 0 14px #ff0033, 0 0 4px #ff0033; animation: pulse 1.5s infinite; }
        header h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #ffffff; text-shadow: 0 0 8px rgba(255, 0, 51, 0.6); }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: radial-gradient(circle at center, #140205 0%, #050505 100%); }
        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-thumb { background: #3a000a; border-radius: 10px; }
        .message { max-width: 85%; padding: 14px 18px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.2s ease-out forwards; }
        .user-message { background: linear-gradient(135deg, #8b0016, #4a000b); color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; border: 1px solid #ff0033; box-shadow: 0 4px 15px rgba(255, 0, 51, 0.25); }
        .bot-message { background-color: #121212; color: #e5e7eb; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #262626; box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8); }
        .bot-message code { background-color: #000000; padding: 3px 6px; border-radius: 4px; font-family: monospace; color: #ff3355; font-weight: bold; border: 1px solid #4a000b; text-shadow: 0 0 5px rgba(255, 51, 85, 0.4); }
        .bot-message strong { color: #ff2a4b; text-shadow: 0 0 4px rgba(255, 42, 75, 0.3); }
        .typing-indicator { display: flex; gap: 5px; padding: 14px 22px !important; }
        .typing-indicator span { width: 8px; height: 8px; background-color: #ff0033; box-shadow: 0 0 6px #ff0033; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        footer { background-color: #080808; padding: 16px; border-top: 2px solid #262626; }
        .input-area { max-width: 600px; margin: 0 auto; display: flex; gap: 12px; background-color: #121212; padding: 6px 6px 6px 18px; border-radius: 12px; border: 1px solid #404040; transition: all 0.3s ease; }
        .input-area:focus-within { border-color: #ff0033; box-shadow: 0 0 18px rgba(255, 0, 51, 0.3); }
        input { flex: 1; background: none; border: none; color: #ffffff; font-size: 1rem; outline: none; }
        input::placeholder { color: #525252; }
        button { background: linear-gradient(135deg, #5a0011, #1f0005); color: #ffffff; border: 1px solid #8b0016; padding: 10px 24px; border-radius: 8px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s ease; }
        button:hover { background: linear-gradient(135deg, #8b0016, #3a000a); border-color: #ff0033; box-shadow: 0 0 12px rgba(255, 0, 51, 0.4); transform: translateY(-1px); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 14px #ff0033; } 50% { transform: scale(1.2); opacity: 0.4; box-shadow: 0 0 4px #ff0033; } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body>
    <header><div class="status-dot"></div><h1>Crimson AI</h1></header>
    <div id="chat-container"><div class="message bot-message">Conectado à Crimson AI. Sistema operacional está ativo. Pode ditar as ordens, Gaster.</div></div>
    <footer>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Dite sua mensagem..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button onclick="sendMessage()">ENVIAR</button>
        </div>
    </footer>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        function formatMarkdown(text) { return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`(.*?)`/g, '<code>$1</code>').replace(/\n/g, '<br>'); }
        function appendMessage(text, isUser, isHTML = false) {
            const msgDiv = document.createElement('div'); msgDiv.classList.add('message', isUser ? 'user-message' : 'bot-message');
            if (isHTML) { msgDiv.innerHTML = text; } else { msgDiv.innerText = text; }
            chatContainer.appendChild(msgDiv); chatContainer.scrollTop = chatContainer.scrollHeight; return msgDiv;
        }
        function handleKeyPress(event) { if (event.key === 'Enter') { sendMessage(); } }
        async function sendMessage() {
            const messageText = userInput.value.trim(); if (!messageText) return;
            appendMessage(messageText, true); userInput.value = '';
            const typingIndicator = appendMessage('<span></span><span></span><span></span>', false, true); typingIndicator.classList.add('typing-indicator');
            try {
                const response = await fetch('https://crimson-ai-1mis.onrender.com/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: messageText }) });
                const data = await response.json(); typingIndicator.remove(); appendMessage(formatMarkdown(data.response), false, true);
            } catch (error) { typingIndicator.remove(); appendMessage("Falha na conexão carmesim. O servidor do Render está acordado?", false); }
        }
    </script>
</body>
</html>
